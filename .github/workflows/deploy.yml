# Builds the site and publishes it to GitHub Pages on every push to master.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   VITE_TRAVELTIME_APP_ID and VITE_TRAVELTIME_API_KEY
# and Pages enabled with Source: GitHub Actions (Settings → Pages).
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check TravelTime secrets
        env:
          VITE_TRAVELTIME_APP_ID: ${{ secrets.VITE_TRAVELTIME_APP_ID }}
          VITE_TRAVELTIME_API_KEY: ${{ secrets.VITE_TRAVELTIME_API_KEY }}
        run: |
          if [ -z "$VITE_TRAVELTIME_APP_ID" ] || [ -z "$VITE_TRAVELTIME_API_KEY" ]; then
            echo "::error::Add the VITE_TRAVELTIME_APP_ID and VITE_TRAVELTIME_API_KEY repository secrets."
            exit 1
          fi

      - run: npm ci

      - name: Build
        env:
          VITE_TRAVELTIME_APP_ID: ${{ secrets.VITE_TRAVELTIME_APP_ID }}
          VITE_TRAVELTIME_API_KEY: ${{ secrets.VITE_TRAVELTIME_API_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
